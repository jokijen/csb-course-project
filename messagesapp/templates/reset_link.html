{% extends "base.html" %}
{% block title %}Forgot password - Messages app{% endblock %}
{% block content %}

    <div class="container">
        <h1>Forgot your password?</h1>
        <p>Enter your email address to receive a password reset link</p>

        <form action="{% url 'reset_link' %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if form.errors %}
            <div class="error-msg">
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <button class="submit">Continue</button>
        </form>
    </div>
{% endblock %}
